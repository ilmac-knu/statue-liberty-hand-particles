<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>손짓으로 만드는 자유의 여신상 | 3D Particle</title><style>
*{box-sizing:border-box}body{margin:0;background:#050914;color:#eaf6ff;font-family:system-ui,'Malgun Gothic',sans-serif;overflow:hidden}canvas#scene{display:block;width:100vw;height:100dvh}.hud{position:fixed;top:14px;left:14px;right:14px;pointer-events:none}.hud h1{font-size:clamp(16px,3.7vw,24px);margin:0 0 5px;text-shadow:0 2px 12px #000}.hud p{margin:0;color:#a9d7e8;font-size:12px;line-height:1.6}.status{display:inline-block;background:#142c3dcc;border:1px solid #32637a;border-radius:99px;padding:5px 11px;margin-top:10px;font-size:12px}.bottom{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:10px;right:10px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}button{background:#10384b;border:1px solid #4cc9de;color:#effcff;border-radius:12px;padding:11px 12px;font-size:13px;font-weight:700;cursor:pointer}button:active{transform:scale(.97)}button.primary{background:#147f99}#preview{position:fixed;right:12px;top:12px;width:110px;height:83px;object-fit:cover;transform:scaleX(-1);border:1px solid #4cc9de;border-radius:10px;display:none;opacity:.7}#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);padding:8px 14px;background:#071724e8;border-radius:9px;white-space:nowrap;font-size:12px;max-width:95vw;overflow:hidden;text-overflow:ellipsis} .hint{position:fixed;top:116px;left:14px;color:#cce3f0;font-size:12px;line-height:1.7;pointer-events:none}@media(max-width:450px){#preview{top:128px;width:88px;height:66px}.hint{top:120px;max-width:70%}.bottom button{padding:10px 8px;font-size:12px}}</style></head><body>
<canvas id="scene"></canvas><video id="preview" autoplay playsinline muted></video><div class="hud"><h1>✨ 손짓으로 만드는 자유의 여신상</h1><p>Hand-Tracked 3D Particle Animation<br>손바닥 펼치기 → 분해 · 주먹 쥐기 → 결합</p><span class="status" id="status">3D 모델 불러오는 중…</span></div><div class="hint">손 추적 시작 후 손을 카메라에 보여주세요.<br>손 추적 없이도 아래 버튼으로 체험 가능합니다.</div><div id="toast">자유의 여신상 입자 조립 중…</div><div class="bottom"><button class="primary" id="handBtn">✋ 손 추적 시작</button><button id="scatterBtn">💥 입자 분해</button><button id="gatherBtn">✨ 다시 결합</button><button id="spinBtn">🔄 자동 회전: 켬</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
import {MeshSurfaceSampler} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/math/MeshSurfaceSampler.js';
const status=document.getElementById('status'),toast=document.getElementById('toast'),video=document.getElementById('preview');
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('scene'),antialias:false,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x050914);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,0,10.5);
const group=new THREE.Group();scene.add(group);scene.add(new THREE.AmbientLight(0xffffff,1));
const COUNT=/Android|iPhone|iPad/i.test(navigator.userAgent)?3600:6500;let pos,home,velocity,scatterTargets,points,mode='gather',rotating=true,handX=0,handY=0,handActive=false,frame=0;
function setToast(s){toast.textContent=s}function setStatus(s){status.textContent=s}
function buildFromPositions(coords){const n=COUNT;home=new Float32Array(n*3);pos=new Float32Array(n*3);velocity=new Float32Array(n*3);scatterTargets=new Float32Array(n*3);for(let i=0;i<n;i++){const j=i*3,k=(i%Math.floor(coords.length/3))*3;for(let a=0;a<3;a++){home[j+a]=coords[k+a];pos[j+a]=(Math.random()-.5)*12;scatterTargets[j+a]=(Math.random()-.5)*(a===1?12:14)}}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));const cols=new Float32Array(n*3);for(let i=0;i<n;i++){let t=Math.random();cols[i*3]=.12+.30*t;cols[i*3+1]=.68+.28*t;cols[i*3+2]=.77+.23*t}geo.setAttribute('color',new THREE.BufferAttribute(cols,3));const mat=new THREE.PointsMaterial({size:.034,vertexColors:true,transparent:true,opacity:.94,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});points=new THREE.Points(geo,mat);group.add(points);setStatus('준비 완료 · 손 추적 또는 버튼 사용');setToast('✨ 빛 입자가 자유의 여신상을 완성합니다')}
function procedural(){// 모델 파일이 없을 때 사용하는 간단한 여신상 형상 안내용 대체 모델
const c=[];function cylinder(cx,cy,cz,r1,r2,y1,y2,num){for(let i=0;i<num;i++){let y=y1+Math.random()*(y2-y1),t=(y-y1)/(y2-y1),r=r1+(r2-r1)*t,a=Math.random()*Math.PI*2;c.push(cx+r*Math.cos(a),cy+y,cz+r*Math.sin(a))}}function ball(cx,cy,cz,rx,ry,rz,num){for(let i=0;i<num;i++){let a=Math.random()*Math.PI*2,u=Math.random()*2-1,s=Math.sqrt(1-u*u);c.push(cx+rx*s*Math.cos(a),cy+ry*u,cz+rz*s*Math.sin(a))}}cylinder(0,0,0,1.1,.88,-2.7,-2.25,700);cylinder(0,0,0,.8,.38,-2.25,1.25,4200);ball(0,1.53,0,.35,.45,.32,650);cylinder(-.57,0,0,.22,.17,.15,1.15,400);cylinder(.49,0,0,.21,.13,.8,2.8,650);ball(.49,2.9,0,.21,.25,.21,250);for(let i=0;i<7;i++){let a=i*Math.PI*2/7;cylinder(.27*Math.cos(a),0,.27*Math.sin(a),.07,.015,1.83,2.26,65)}cylinder(-.55,0,0,.15,.15,-.05,.48,230);return c}
function loadGLB(){const loader=new GLTFLoader();loader.load('./statue_of_liberty_1.glb',gltf=>{try{let meshes=[];gltf.scene.updateMatrixWorld(true);gltf.scene.traverse(o=>{if(o.isMesh&&o.geometry?.attributes?.position){let cloned=o.geometry.clone();cloned.applyMatrix4(o.matrixWorld);meshes.push(new THREE.Mesh(cloned,new THREE.MeshBasicMaterial()))}});if(!meshes.length)throw Error('mesh 없음');const counts=meshes.map(m=>Math.max(1,Math.round(m.geometry.attributes.position.count/3)));const total=counts.reduce((a,b)=>a+b,0);const samples=[];let v=new THREE.Vector3();for(let i=0;i<COUNT;i++){let r=Math.random()*total,idx=0;while(idx<counts.length-1&&r>counts[idx])r-=counts[idx++];new MeshSurfaceSampler(meshes[idx]).build().sample(v);samples.push(v.x,v.y,v.z)}let box=new THREE.Box3().setFromArray(samples),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),scale=5.5/Math.max(size.x,size.y,size.z);for(let i=0;i<samples.length;i+=3){samples[i]=(samples[i]-center.x)*scale;samples[i+1]=(samples[i+1]-center.y)*scale;samples[i+2]=(samples[i+2]-center.z)*scale}buildFromPositions(samples);setToast('실제 GLB 모델로 자유의 여신상 입자 생성 완료')}catch(e){console.warn(e);buildFallback()}} ,undefined,()=>buildFallback())}
function buildFallback(){let arr=procedural();buildFromPositions(arr);setToast('⚠️ 예시 형상 표시 중 · 실제 자유의 여신상 GLB 파일을 저장소에 추가하세요')}
function action(next){mode=next;setToast(next==='scatter'?'💥 손짓에 반응해 자유의 여신상이 분해됩니다':'✨ 입자들이 모여 자유의 여신상을 만듭니다')}
document.getElementById('scatterBtn').onclick=()=>action('scatter');document.getElementById('gatherBtn').onclick=()=>action('gather');document.getElementById('spinBtn').onclick=e=>{rotating=!rotating;e.currentTarget.textContent='🔄 자동 회전: '+(rotating?'켬':'끔')};
let lastGesture='',lastChange=0;function onHands(results){if(!results.multiHandLandmarks?.length){handActive=false;setStatus('손이 보이지 않습니다 · 카메라 앞에 손을 보여주세요');return}const h=results.multiHandLandmarks[0];handActive=true;handX=(.5-h[9].x)*2;handY=(.5-h[9].y)*2;let ext=0;for(const [tip,pip] of [[8,6],[12,10],[16,14],[20,18]])if(Math.hypot(h[tip].x-h[0].x,h[tip].y-h[0].y)>Math.hypot(h[pip].x-h[0].x,h[pip].y-h[0].y)*1.13)ext++;let g=ext>=3?'scatter':ext<=1?'gather':'neutral';setStatus(g==='scatter'?'✋ 펼친 손 인식 · 입자 분해':g==='gather'?'✊ 주먹 인식 · 입자 결합':'🖐 손 인식 · 손을 펴거나 쥐세요');let now=performance.now();if(g!=='neutral'&&g!==lastGesture&&now-lastChange>450){lastGesture=g;lastChange=now;action(g)}}
async function startHands(){const btn=document.getElementById('handBtn');btn.disabled=true;setStatus('카메라와 손 추적 엔진 준비 중…');try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS에서 접속해 주세요');await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js');const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;video.style.display='block';await video.play();const hands=new window.Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.65,minTrackingConfidence:.55});hands.onResults(onHands);let busy=false;async function loop(){if(video.readyState>=2&&!busy){busy=true;try{await hands.send({image:video})}catch(e){console.warn(e)}busy=false}requestAnimationFrame(loop)}loop();btn.textContent='📷 손 추적 실행 중';setStatus('손 추적 시작 · 손바닥을 펼쳐 보세요')}catch(e){setStatus('손 추적 시작 실패 · 버튼으로 체험 가능');setToast('카메라 권한과 인터넷 연결을 확인하세요: '+e.message);btn.disabled=false}}
function loadScript(src){return new Promise((res,rej)=>{let s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(Error('손 추적 라이브러리 다운로드 실패'));document.head.appendChild(s)})}document.getElementById('handBtn').onclick=startHands;
let last=performance.now();function tick(now){requestAnimationFrame(tick);let dt=Math.min((now-last)/16.67,2);last=now;if(points){let target=mode==='gather'?home:scatterTargets;let damping=Math.pow(mode==='gather'?.87:.92,dt),force=(mode==='gather'?.024:.012)*dt;for(let i=0;i<pos.length;i+=3){for(let j=0;j<3;j++){let k=i+j;velocity[k]=(velocity[k]+(target[k]-pos[k])*force)*damping;pos[k]+=velocity[k]*dt}if(mode==='scatter'){pos[i]+=(Math.sin(now*.001+i)*.0015);pos[i+1]+=(Math.cos(now*.001+i)*.0015)}}points.geometry.attributes.position.needsUpdate=true;if(rotating)group.rotation.y+=.0025*dt;if(handActive){group.rotation.y+=(handX*.6-group.rotation.y)*.025;group.rotation.x+=(handY*.20-group.rotation.x)*.025}else group.rotation.x*=.99}renderer.render(scene,camera)}requestAnimationFrame(tick);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.position.z=innerWidth<600?13.5:10.5;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});if(innerWidth<600){camera.position.z=13.5;camera.updateProjectionMatrix()}loadGLB();
</script></body></html>
